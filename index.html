    <meta name="description" content="IELTS 핵심 단어 7,298개. 단어마다 오리지널 일러스트와 예문 두 개, 영국·미국 발음을 담았어요. 하나를 익힐 때마다 별 하나가 켜져요. 무료, 오픈 소스, 가입 없이." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="별빛 단어장 · 한 단어 한 그림, IELTS를 밝히다" />
    <meta property="og:description" content="IELTS 단어 7,298개, 단어마다 그림 한 장. 하나를 익힐 때마다 별 하나가 켜져요. 무료, 오픈 소스, 가입 없이." />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
